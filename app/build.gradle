plugins {
    id "com.android.application"
}

def gitCommitHash = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
}.standardOutput.asText.map { it.trim() }

def gitCommitCount = providers.exec {
    commandLine 'git', 'rev-list', '--count', 'HEAD'
}.standardOutput.asText.map { it.trim().toInteger() }

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def signingStoreFile = localProperties.getProperty('signing.storeFile')
def signingStorePassword = localProperties.getProperty('signing.storePassword')
def signingKeyAlias = localProperties.getProperty('signing.keyAlias')
def signingKeyPassword = localProperties.getProperty('signing.keyPassword')
def hasLocalSigningConfig = [signingStoreFile, signingStorePassword, signingKeyAlias, signingKeyPassword].every { it }

android {
    namespace "dev.koyufox.fuckpinning"
    compileSdk 35

    defaultConfig {
        applicationId "dev.koyufox.fuckpinning"
        minSdk 26
        targetSdk 35
        versionCode gitCommitCount.get()
        versionName '1.0.0'
        versionNameSuffix gitCommitHash.map { "-${it}" }.get()
        proguardFiles

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        if (hasLocalSigningConfig) {
            local {
                storeFile rootProject.file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            multiDexEnabled true
            if (hasLocalSigningConfig) {
                signingConfig signingConfigs.local
            }
        }
        debug {
            minifyEnabled false
            if (hasLocalSigningConfig) {
                signingConfig signingConfigs.local
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            merges += "META-INF/xposed/*"
            excludes += "**"
        }
    }
}

dependencies {
    compileOnly("io.github.libxposed:api:101.0.1")
    compileOnly 'androidx.annotation:annotation:1.10.0'
    implementation 'org.luckypray:dexkit:2.2.0'
}
